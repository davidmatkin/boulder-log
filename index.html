// ---------- helpers ----------
// Local dates, not UTC — evening sessions must not roll over to tomorrow's date.
const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayStr = () => localDateStr(new Date());
const daysAgoStr = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return localDateStr(d); };
const weekdayName = (d) => new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "long" });
const fmtDate = (d) =>
  new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const mmss = (sec) => {
  if (sec == null) return "—";
  sec = Math.max(0, sec); // clock state can lag a just-logged climb by up to 1s
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
};

function sessionStats(s) {
  if (s.legacy) {
    const dist = s.dist;
    const n = s.probs ?? Object.values(dist).reduce((a, b) => a + b, 0);
    return { climbs: n || 0, effort: s.score, sends: n || 0, sendScore: s.score, avgPerc: n ? (s.score / n) : 0, avgRest: null, dist };
  }
  const climbs = s.climbs || [];
  const dist = {};
  let effort = 0, sendScore = 0, sends = 0, percSum = 0;
  climbs.forEach((c) => {
    // Scoring rule: posted grade counts unless it's a fall, which counts at perceived grade.
    const scoreGrade = c.sent ? c.gym : c.perceived;
    const p = pts(scoreGrade);
    effort += p;
    percSum += scoreGrade;
    const key = c.sent && c.mb ? c.mb : scoreGrade; // sent board climbs ledger as their own (MB3×n) term
    dist[key] = (dist[key] || 0) + 1;
    if (c.sent) { sends += 1; sendScore += p; }
  });
  let restSum = 0, restN = 0;
  for (let i = 1; i < climbs.length; i++) {
    const gap = (climbs[i].ts - climbs[i - 1].ts) / 1000;
    if (gap > 5 && gap < 3600) { restSum += gap; restN += 1; }
  }
  return {
    climbs: climbs.length, effort, sends, sendScore,
    avgPerc: climbs.length ? percSum / climbs.length : 0,
    avgRest: restN ? restSum / restN : null, dist,
  };
}

const ledger = (dist) => {
  const ks = Object.keys(dist).sort((a, b) => {
    const d = keyPts(a) - keyPts(b);
    return d !== 0 ? d : MB_PTS[a] !== undefined ? 1 : -1; // V term before MB term at equal point value
  });
  if (!ks.length) return "";
  const total = ks.reduce((sum, k) => sum + keyPts(k) * dist[k], 0);
  return ks.map((k) => `(${MB_PTS[k] !== undefined ? k : Number(k)}×${dist[k]})`).join(" + ") + ` = ${total}`;
};

function download(name, text, type = "text/markdown") {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

// ---------- sharing suite (6a/6b/6c) ----------
const SCHEMA_VERSION = 1;

function sessionShareText(s) {
  const st = sessionStats(s);
  const L = [];
  L.push(`# Boulder Log — ${s.date} ${s.label || ""}${s.intent ? ` [${s.intent}]` : ""}`.trimEnd());
  L.push(`Problems: ${st.climbs} | Effort: ${st.effort}${s.legacy ? "" : ` | Sends: ${st.sends} (${st.sendScore})`}`);
  const led = ledger(st.dist);
  if (led) L.push(`Ledger: ${led}`);
  if (s.goal) L.push(`Goal: ${s.goal}`);
  const cs = s.climbs || [];
  if (cs.length) {
    L.push("Climbs:");
    cs.forEach((c, i) => {
      const rest = i > 0 ? Math.round((c.ts - cs[i - 1].ts) / 1000) : null;
      const tags = [c.system ? `system${c.name ? ` "${c.name}"` : ""}` : "", c.angle, c.style].filter(Boolean).join(" ");
      const bits = [gradeLabel(c), typeLabel(climbType(c)), qualityLabel(c.quality), tags, !c.sent ? `effort V${c.perceived}` : "", c.note].filter(Boolean).join(" ");
      L.push(`- ${bits}${rest != null ? ` (rest ${rest}s)` : ""}`);
    });
  }
  if (s.exercises) L.push(`Exercises: ${s.exercises}`);
  if (s.notes) L.push(`Notes: ${s.notes}`);
  if (s.day_after) L.push(`Day-after: ${s.day_after.status}${s.day_after.note ? ` — ${s.day_after.note}` : ""}`);
  return L.join("\n");
}

function entryShareText(e) {
  const L = [];
  L.push(`# Boulder Log entry — ${e.date} [${e.kind || "entry"}${e.issue ? ` / ${e.issue}` : ""}]`);
  if (e.kind === "test" && e.test_name) L.push(`${e.test_name}: ${e.test_value}${e.test_unit ? ` ${e.test_unit}` : ""}`);
  if (e.note) L.push(e.note);
  return L.join("\n");
}

function digestText(data, maxChars = 4000) {
  const cutoff = daysAgoStr(42);
  let sess = [...data.sessions].filter((s) => s.date >= cutoff).sort((a, b) => (a.date < b.date ? 1 : -1));
  let ents = (data.entries || []).filter((e) => e.date >= cutoff).sort((a, b) => (a.date < b.date ? 1 : -1));
  const build = () => {
    const L = [`# Boulder Log digest — ${todayStr()}`];
    if (sess.length) {
      L.push("## Sessions");
      sess.forEach((s) => {
        const st = sessionStats(s);
        const led = ledger(st.dist);
        L.push(`- ${s.date}${s.intent ? ` [${s.intent}]` : ""} ${st.climbs}p, effort ${st.effort}${led ? `, ${led}` : ""}`);
        const extra = [];
        if (s.day_after) extra.push(`day-after: ${s.day_after.status}${s.day_after.note ? ` ${s.day_after.note}` : ""}`);
        if (s.notes) extra.push(`notes: ${s.notes.replace(/\n/g, " ")}`);
        if (extra.length) L.push(`  ${extra.join(" | ")}`);
      });
    }
    const plain = ents.filter((e) => e.kind !== "test");
    if (plain.length) {
      L.push("## Training entries");
      plain.forEach((e) => L.push(`- ${e.date} [${e.kind}${e.issue ? `/${e.issue}` : ""}] ${(e.note || "").replace(/\n/g, " ")}`));
    }
    const tests = ents.filter((e) => e.kind === "test" && e.test_name);
    if (tests.length) {
      L.push("## Tests");
      const byName = {};
      tests.forEach((e) => { (byName[e.test_name] = byName[e.test_name] || []).push(e); });
      Object.keys(byName).forEach((name) => {
        const es = [...byName[name]].sort((a, b) => (a.date > b.date ? 1 : -1));
        const unit = es[es.length - 1].test_unit;
        L.push(`- ${name}: ${es.map((e) => e.test_value).join(" → ")}${unit ? ` ${unit}` : ""} (${es[0].date} → ${es[es.length - 1].date})`);
      });
    }
    const issues = {};
    ents.filter((e) => e.kind === "injury" && e.issue).forEach((e) => {
      if (!issues[e.issue] || issues[e.issue].date < e.date) issues[e.issue] = e;
    });
    if (Object.keys(issues).length) {
      L.push("## Open issues");
      Object.keys(issues).forEach((k) => L.push(`- ${k}: last entry ${issues[k].date}, ${(issues[k].note || "").replace(/\n/g, " ")}`));
    }
    return L.join("\n");
  };
  let out = build();
  while (out.length > maxChars && (sess.length || ents.length)) {
    // drop the oldest item first (lists are newest-first, so oldest is last)
    if (sess.length >= ents.length) sess = sess.slice(0, -1); else ents = ents.slice(0, -1);
    out = build();
  }
  return out;
}

function backupText(data) {
  const sess = data.sessions || [], ents = data.entries || [];
  const dates = sess.map((s) => s.date).sort();
  const when = new Date().toLocaleString();
  const summary = `${sess.length} sessions from ${dates[0] || "—"} to ${dates[dates.length - 1] || "—"}, ` +
    `${ents.length} standalone entries, ${(data.deleted || []).length} deleted ids (tombstones).`;
  const dump = JSON.stringify({ schema_version: SCHEMA_VERSION, ...data }, null, 2);
  return `# Boulder Log backup — ${when}\n\n${summary}\n\n## Recent digest\n\n${digestText(data)}\n\n## Complete data (lossless)\n\n\`\`\`json\n${dump}\n\`\`\`\n`;
}

function parseBackup(text) {
  const start = text.indexOf("```json");
  const close = text.lastIndexOf("```");
  if (start === -1 || close <= start) throw new Error("No JSON block found — paste the whole backup file.");
  const open = text.indexOf("\n", start) + 1;
  let obj;
  try { obj = JSON.parse(text.slice(open, close)); }
  catch { throw new Error("The JSON block wouldn't parse — is the paste complete?"); }
  if (typeof obj.schema_version !== "number") throw new Error("Missing schema_version — not a Boulder Log backup.");
  if (obj.schema_version > SCHEMA_VERSION) throw new Error(`Backup schema v${obj.schema_version} is newer than this app (v${SCHEMA_VERSION}).`);
  if (!Array.isArray(obj.sessions)) throw new Error("Backup has no sessions array.");
  return obj;
}

const TCOLOR = { prep: "#6a7280", work: "#5bb98c", restRep: "#4a8fb8", restSet: "#4a8fb8", await: "#4a8fb8", done: "#f2efe8" };
const TLABEL = { prep: "Get Ready", work: "GO", restRep: "Rest", restSet: "Set Break", await: "Set Done", done: "Done" };

let _actx = null;
const audioCtx = () => { if (!_actx) { try { _actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } return _actx; };
function beep(freq, dur = 0.15, vol = 0.35) {
  const c = audioCtx(); if (!c) return;
  try {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  } catch {}
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  try { const u = new SpeechSynthesisUtterance(text); u.rate = 1; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {}
}

// ---------- app ----------
function BoulderLog() {
  const [data, setData] = useState(null); // {sessions:[]}
  const [tab, setTab] = useState("session");
  const [selGrade, setSelGrade] = useState(null);
  const [mode, setMode] = useState(null); // null | "fell" | "quality"
  const [editOpen, setEditOpen] = useState(false);
  const [confirmCancel, setConfirmCancel] = useState(false);
  const [tableOpen, setTableOpen] = useState(false);
  const [entryDraft, setEntryDraft] = useState(null); // standalone-entry form state
  const [checkinNote, setCheckinNote] = useState("");
  const [shareMsg, setShareMsg] = useState("");
  const [shareFallback, setShareFallback] = useState(null); // text shown for manual copy when share+clipboard both fail
  const [importText, setImportText] = useState("");
  const [importPreview, setImportPreview] = useState(null);
  const shareMsgTimer = useRef(null);
  const [now, setNow] = useState(Date.now());
  const [status, setStatus] = useState("");
  const [lastSaved, setLastSaved] = useState(null);
  const saveTimer = useRef(null);

  // load
  useEffect(() => {
    (async () => {
      let d;
      try {
        const r = await storageLS.get(KEY);
        d = JSON.parse(r.value);
      } catch {
        d = { sessions: [] };
      }
      if (!d.deleted) d.deleted = [];
      if (!d.entries) d.entries = []; // standalone entries (exercise / injury / test / note)
      // auto-end any unfinished session from a previous day so days never merge
      const today = todayStr();
      d.sessions = d.sessions.map((s) => (!s.legacy && !s.ended && s.date !== today ? { ...s, ended: true } : s));
      // merge in any notebook sessions not already present and not deliberately deleted
      const have = new Set(d.sessions.map((s) => s.id));
      const gone = new Set(d.deleted);
      LEGACY.forEach((l) => { if (!have.has(l.id) && !gone.has(l.id)) d.sessions.push(l); });
      setData(d);
      // storage self-test: write a probe and read it back
      try {
        const probe = "p" + Date.now();
        await storageLS.set(KEY + "-probe", probe);
        const back = await storageLS.get(KEY + "-probe");
        if (JSON.parse(JSON.stringify(back.value)) !== probe) throw new Error("mismatch");
      } catch {
        setStatus("⚠ Storage test failed — data may NOT survive closing the app. Export CSV before leaving the gym.");
      }
    })();
  }, []);

  // persist (debounced)
  useEffect(() => {
    if (!data) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await storageLS.set(KEY, JSON.stringify(data));
        setStatus("");
        setLastSaved(new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
      } catch {
        setStatus("⚠ Couldn't save — data is in memory only right now. Export CSV before closing.");
      }
    }, 600);
  }, [data]);

  // clock for rest display
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  if (!data) return <div style={ui.shell}><div style={{ padding: 40, color: "#8b8f98" }}>Loading…</div></div>;

  const active = data.sessions.find((s) => !s.legacy && !s.ended);
  const climbs = active?.climbs || [];
  const last = climbs[climbs.length - 1];
  const restSince = last ? (now - last.ts) / 1000 : null;
  const stats = active ? sessionStats(active) : null;

  const update = (fn) => setData((d) => ({ ...d, sessions: d.sessions.map(fn) }));

  const startSession = () => {
    const s = { id: "S" + Date.now(), date: todayStr(), label: "Lehi", goal: "", exercises: "", notes: "", climbs: [], ended: false };
    setData((d) => ({ ...d, sessions: [...d.sessions, s] }));
    setTab("session");
  };

  const logClimb = (gym, perceived, type) => {
    const mb = typeof gym === "string" ? gym : null; // "MB3"/"MB4" discs carry a fixed effort value
    const postedNum = mb ? MB_PTS[mb] : gym;
    const percNum = typeof perceived === "string" ? MB_PTS[perceived] : perceived;
    const c = { ts: Date.now(), gym: postedNum, perceived: percNum, type, sent: type !== "fell", quality: "", system: !!mb, name: "", angle: "", style: "", note: "" };
    if (mb) c.mb = mb;
    update((s) => (s.id === active.id ? { ...s, climbs: [...s.climbs, c] } : s));
    setSelGrade(null);
    setMode(type === "fell" ? null : "quality");
    setEditOpen(false);
  };

  const patchLast = (patch) =>
    update((s) => {
      if (s.id !== active.id) return s;
      const cs = [...s.climbs];
      cs[cs.length - 1] = { ...cs[cs.length - 1], ...patch };
      return { ...s, climbs: cs };
    });

  const deleteLast = () => {
    update((s) => (s.id === active.id ? { ...s, climbs: s.climbs.slice(0, -1) } : s));
    setEditOpen(false);
  };

  const patchSession = (patch) => update((s) => (s.id === active.id ? { ...s, ...patch } : s));
  const endSession = () => { patchSession({ ended: true }); setEditOpen(false); setTab("history"); }; // History = the summary screen, with Share on top
  const cancelSession = () => {
    setData((d) => ({ ...d, sessions: d.sessions.filter((s) => s.id !== active.id) }));
    setEditOpen(false); setSelGrade(null); setMode(null); setConfirmCancel(false);
  };

  // ----- sharing (6a) -----
  const receipt = (msg) => {
    setShareMsg(msg);
    clearTimeout(shareMsgTimer.current);
    shareMsgTimer.current = setTimeout(() => setShareMsg(""), 2500);
  };
  const doShare = async (text) => {
    if (navigator.share) {
      try { await navigator.share({ text }); return; }
      catch (err) { if (err && err.name === "AbortError") return; } // user closed the sheet
    }
    try { await navigator.clipboard.writeText(text); receipt("copied to clipboard"); }
    catch { setShareFallback(text); }
  };

  // ----- backup export + restore (6c) -----
  const shareBackup = async () => {
    const text = backupText(data);
    try {
      const file = new File([text], "boulder-log-backup.md", { type: "text/markdown" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "boulder-log-backup.md" }); return; }
        catch (err) { if (err && err.name === "AbortError") return; }
      }
    } catch {} // File constructor or canShare unavailable — fall through to download
    download("boulder-log-backup.md", text);
    receipt("downloaded boulder-log-backup.md");
  };

  const previewImport = () => {
    try {
      const b = parseBackup(importText);
      const haveS = new Set(data.sessions.map((s) => s.id));
      const haveE = new Set((data.entries || []).map((e) => e.id));
      const gone = new Set([...(data.deleted || []), ...(b.deleted || [])]);
      setImportPreview({
        backup: b,
        newS: (b.sessions || []).filter((s) => !haveS.has(s.id) && !gone.has(s.id)),
        newE: (b.entries || []).filter((e) => !haveE.has(e.id) && !gone.has(e.id)),
      });
    } catch (err) {
      setImportPreview({ error: err.message });
    }
  };
  const applyImport = () => {
    const { backup, newS, newE } = importPreview;
    setData((d) => ({
      ...d,
      sessions: [...d.sessions, ...newS],
      entries: [...(d.entries || []), ...newE],
      deleted: Array.from(new Set([...(d.deleted || []), ...(backup.deleted || [])])),
    }));
    setImportPreview(null);
    setImportText("");
    receipt("backup merged");
  };

  const deleteSession = (id) =>
    setData((d) => ({
      ...d,
      sessions: d.sessions.filter((s) => s.id !== id),
      deleted: [...(d.deleted || []), id],
    }));

  // ----- standalone entries (feature 1) -----
  const blankEntry = () => ({ date: todayStr(), kind: "", test_name: "", test_value: "", test_unit: "", note: "" });
  const entryValid =
    entryDraft && entryDraft.kind &&
    (entryDraft.kind !== "test" ||
      (entryDraft.test_name.trim() && entryDraft.test_value.trim() !== "" && !isNaN(Number(entryDraft.test_value))));
  const saveEntry = () => {
    if (!entryValid) return;
    const e = { id: "E" + Date.now(), date: entryDraft.date || todayStr(), kind: entryDraft.kind, note: entryDraft.note.trim() };
    if (entryDraft.kind === "test") {
      e.test_name = entryDraft.test_name.trim();
      e.test_value = Number(entryDraft.test_value);
      e.test_unit = entryDraft.test_unit.trim();
    }
    setData((d) => ({ ...d, entries: [...(d.entries || []), e] }));
    setEntryDraft(null);
  };
  const deleteEntry = (id) =>
    setData((d) => ({
      ...d,
      entries: (d.entries || []).filter((e) => e.id !== id),
      deleted: [...(d.deleted || []), id],
    }));

  // ----- morning-after check-in (feature 2) -----
  const lastEnded = [...data.sessions]
    .filter((s) => !s.legacy && s.ended)
    .sort((a, b) => (a.date < b.date ? 1 : -1))[0];
  const checkin =
    lastEnded && !lastEnded.day_after && !lastEnded.day_after_dismissed &&
    (lastEnded.date === daysAgoStr(1) || lastEnded.date === daysAgoStr(2))
      ? lastEnded : null;
  const answerCheckin = (statusWord) => {
    update((s) =>
      s.id === checkin.id
        ? { ...s, day_after: { status: statusWord, note: checkinNote.trim(), recorded_at: new Date().toISOString() } }
        : s
    );
    setCheckinNote("");
  };
  const dismissCheckin = () => update((s) => (s.id === checkin.id ? { ...s, day_after_dismissed: true } : s));

  return (
    <div style={ui.shell}>
      <header style={ui.header}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
          <div style={ui.brand}>BOULDER LOG</div>
          <div style={ui.sub}>{fmtDate(todayStr())}{lastSaved ? ` · saved ${lastSaved}` : ""}</div>
        </div>
        <nav style={{ display: "flex", gap: 6, marginTop: 10 }}>
          {["session", "timer", "history", "export"].map((t) => (
            <button key={t} onClick={() => setTab(t)} style={{ ...ui.tab, flex: 1, ...(tab === t ? ui.tabOn : {}) }}>
              {t[0].toUpperCase() + t.slice(1)}
            </button>
          ))}
        </nav>
      </header>

      {status && <div style={ui.warn}>{status}</div>}
      {shareMsg && <div style={{ ...ui.warn, background: "#16241a", color: "#6BBF8A" }}>{shareMsg}</div>}
      {shareFallback != null && (
        <div style={{ ...ui.card, margin: "12px 16px 0" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <b>Couldn't open the share sheet — copy manually:</b>
            <button style={ui.linkBtn} onClick={() => setShareFallback(null)}>close</button>
          </div>
          <textarea readOnly rows={6} style={{ ...ui.textarea, marginTop: 8 }} value={shareFallback}
            onFocus={(e) => e.target.select()} />
        </div>
      )}

      {checkin && (
        <div style={{ ...ui.card, margin: "12px 16px 0", border: "1px solid #E0A93E" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <b>How do you feel after {weekdayName(checkin.date)}'s session?</b>
            <button style={ui.linkBtn} onClick={dismissCheckin}>dismiss</button>
          </div>
          <input
            style={{ ...ui.input, width: "100%", boxSizing: "border-box", marginTop: 10 }}
            placeholder="fingers? elbow? anything else? (optional)"
            value={checkinNote} onChange={(e) => setCheckinNote(e.target.value)}
          />
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            {DAY_AFTER.map((w) => (
              <button key={w} style={{ ...ui.big, ...ui.sent, fontSize: 15, padding: "12px" }} onClick={() => answerCheckin(w)}>
                {w[0].toUpperCase() + w.slice(1)}
              </button>
            ))}
          </div>
        </div>
      )}

      {tab === "session" && (
        <main style={ui.main}>
          {!active ? (
            <div style={ui.center}>
              <p style={{ color: "#8b8f98", marginBottom: 16 }}>No session running.</p>
              <button style={ui.primary} onClick={startSession}>Start session</button>
              {!entryDraft && (
                <button style={{ ...ui.linkBtn, display: "block", margin: "14px auto 0" }} onClick={() => setEntryDraft(blankEntry())}>
                  log training or a note (no session)
                </button>
              )}
              {entryDraft && (
                <div style={{ ...ui.card, textAlign: "left" }}>
                  <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                    <input type="date" style={ui.input} value={entryDraft.date}
                      onChange={(e) => setEntryDraft({ ...entryDraft, date: e.target.value })} />
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {ENTRY_KINDS.map((k) => (
                        <button key={k} onClick={() => setEntryDraft({ ...entryDraft, kind: entryDraft.kind === k ? "" : k })}
                          style={{ ...ui.chip, ...(entryDraft.kind === k ? ui.chipOn : {}) }}>{k}</button>
                      ))}
                    </div>
                  </div>
                  {entryDraft.kind === "exercise" && (
                    <button style={{ ...ui.linkBtn, display: "block", padding: "8px 0 0" }} onClick={() => setTab("timer")}>
                      open interval timer
                    </button>
                  )}
                  {entryDraft.kind === "test" && (
                    <div style={ui.chipRow}>
                      <input style={{ ...ui.input, flex: "1 1 100%" }} placeholder="test name, e.g. Tindeq half-crimp L"
                        value={entryDraft.test_name} onChange={(e) => setEntryDraft({ ...entryDraft, test_name: e.target.value })} />
                      <input style={{ ...ui.input, width: 90 }} placeholder="value" inputMode="decimal"
                        value={entryDraft.test_value} onChange={(e) => setEntryDraft({ ...entryDraft, test_value: e.target.value })} />
                      <input style={{ ...ui.input, width: 90 }} placeholder="unit (lb, 0-10)"
                        value={entryDraft.test_unit} onChange={(e) => setEntryDraft({ ...entryDraft, test_unit: e.target.value })} />
                    </div>
                  )}
                  <textarea style={{ ...ui.textarea, marginTop: 10 }} rows={3}
                    placeholder={ENTRY_PLACEHOLDER[entryDraft.kind] || "Pick a kind above, then write what happened."}
                    value={entryDraft.note} onChange={(e) => setEntryDraft({ ...entryDraft, note: e.target.value })} />
                  {entryDraft.kind === "test" && entryDraft.test_value.trim() !== "" && isNaN(Number(entryDraft.test_value)) && (
                    <div style={{ fontSize: 12, color: "#E0A93E", marginTop: 6 }}>Test value needs to be a number.</div>
                  )}
                  <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
                    <button style={{ ...ui.primary, flex: 1, opacity: entryValid ? 1 : 0.35 }} disabled={!entryValid} onClick={saveEntry}>
                      Save entry
                    </button>
                    <button style={{ ...ui.ghost, flex: 1 }} onClick={() => setEntryDraft(null)}>Cancel</button>
                  </div>
                </div>
              )}
            </div>
          ) : (
            <>
              {/* live stats */}
              <div style={ui.statRow}>
                <Stat label="Climbs" value={stats.climbs} />
                <Stat label="Effort" value={stats.effort} accent />
                <Stat label="Sends" value={`${stats.sends} · ${stats.sendScore}`} />
                <Stat label="Avg V" value={stats.avgPerc.toFixed(1)} />
              </div>
              <div style={ui.restBlock}>
                <div>
                  <div style={ui.restBig}>{mmss(restSince)}</div>
                  <div style={ui.restLabel}>REST SINCE LAST CLIMB</div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={ui.restAvg}>{mmss(stats.avgRest)}</div>
                  <div style={ui.restLabel}>AVG REST</div>
                </div>
              </div>
              {Object.keys(stats.dist).length > 0 && <div style={ui.ledger}>{ledger(stats.dist)}</div>}
              {climbs.length > 0 && (
                <button style={ui.linkBtn} onClick={() => setTableOpen(!tableOpen)}>
                  {tableOpen ? "hide climb table" : "show climb table"}
                </button>
              )}
              {tableOpen && climbs.length > 0 && (() => {
                let cum = 0;
                return (
                  <div style={{ ...ui.card, marginTop: 6, padding: "8px 12px", overflowX: "auto" }}>
                    <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "ui-monospace, monospace", fontSize: 12, color: "#c9ccd6" }}>
                      <thead>
                        <tr style={{ color: "#8b8f98" }}>
                          <th style={{ textAlign: "left", padding: "2px 8px 6px 0" }}>#</th>
                          <th style={{ textAlign: "left", paddingRight: 8 }}>grade</th>
                          <th style={{ textAlign: "left", paddingRight: 8 }}>type</th>
                          <th style={{ textAlign: "right", paddingRight: 8 }}>pts</th>
                          <th style={{ textAlign: "right", paddingRight: 8 }}>total</th>
                          <th style={{ textAlign: "right" }}>avg</th>
                        </tr>
                      </thead>
                      <tbody>
                        {climbs.map((c, i) => {
                          const p = pts(c.sent ? c.gym : c.perceived);
                          cum += p;
                          return (
                            <tr key={c.ts}>
                              <td style={{ padding: "2px 8px 2px 0" }}>{i + 1}</td>
                              <td style={{ paddingRight: 8 }}>{c.sent ? gradeLabel(c) : `${gradeLabel(c)}→e${c.perceived}`}</td>
                              <td style={{ paddingRight: 8 }}>{typeLabel(climbType(c))}</td>
                              <td style={{ textAlign: "right", paddingRight: 8 }}>{p}</td>
                              <td style={{ textAlign: "right", paddingRight: 8 }}>{cum}</td>
                              <td style={{ textAlign: "right" }}>{(cum / (i + 1)).toFixed(1)}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                );
              })()}

              {/* grade holds */}
              <div style={ui.sectionLabel}>{mode === "fell" ? "GRADE-LEVEL EFFORT OF THE ATTEMPT" : "GRADE"}</div>
              <div style={ui.holdRow}>
                {(mode === "fell" ? DISCS.filter((g) => typeof g === "number") : DISCS).map((g) => {
                  const isMB = typeof g === "string";
                  return (
                    <button
                      key={g}
                      onClick={() => (mode === "fell" ? logClimb(selGrade, g, "fell") : setSelGrade(g === selGrade ? null : g))}
                      style={{
                        ...ui.hold,
                        background: mode === "fell" ? "#4a4e58" : isMB ? "#2b2e38" : HOLD[g],
                        color: mode === "fell" ? "#e8e8ee" : isMB ? "#E0A93E" : HOLD_TEXT[g],
                        border: isMB && mode !== "fell" ? "2px solid #E0A93E" : "none",
                        fontSize: isMB ? 13 : 14,
                        outline: mode !== "fell" && selGrade === g ? "3px solid #f2efe8" : "3px solid transparent",
                        transform: mode !== "fell" && selGrade === g ? "scale(1.12)" : "scale(1)",
                      }}
                    >
                      {isMB ? g : `V${g}`}
                    </button>
                  );
                })}
              </div>

              {mode === "fell" ? (
                <button style={ui.ghost} onClick={() => setMode(null)}>Cancel</button>
              ) : mode === "quality" ? (
                <>
                  <div style={ui.sectionLabel}>GRADE CHECK — HOW DID IT FEEL FOR THE GRADE?</div>
                  <div style={{ display: "flex", gap: 10 }}>
                    {QUALITIES.map((q) => (
                      <button key={q} style={{ ...ui.big, ...ui.sent, fontSize: 15 }}
                        onClick={() => { patchLast({ quality: q }); setMode(null); }}>
                        {q[0].toUpperCase() + q.slice(1)}
                      </button>
                    ))}
                  </div>
                  <button style={{ ...ui.linkBtn, display: "block", margin: "8px auto 0" }} onClick={() => setMode(null)}>skip</button>
                </>
              ) : (
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  {SEND_TYPES.map((t) => (
                    <button key={t} disabled={selGrade == null}
                      style={{ ...ui.big, ...ui.sent, opacity: selGrade == null ? 0.35 : 1 }}
                      onClick={() => logClimb(selGrade, selGrade, t)}>
                      {t[0].toUpperCase() + t.slice(1)}
                    </button>
                  ))}
                  <button disabled={selGrade == null}
                    style={{ ...ui.big, ...ui.fell, opacity: selGrade == null ? 0.35 : 1 }}
                    onClick={() => setMode("fell")}>
                    Attempt
                  </button>
                </div>
              )}

              {/* last climb editor (closed by default) */}
              {last && editOpen && mode == null && (
                <div style={ui.card}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                    <b>
                      Last: {gradeLabel(last)} {typeLabel(climbType(last))}
                      {last.quality ? ` (${qualityLabel(last.quality)})` : ""}
                      {!last.sent ? ` · effort V${last.perceived}` : ""}
                    </b>
                    <button style={ui.linkBtn} onClick={() => setEditOpen(false)}>close</button>
                  </div>
                  {last.sent && (
                    <div style={ui.chipRow}>
                      <span style={ui.chipLabel}>Grade</span>
                      {QUALITIES.map((q) => (
                        <button key={q} onClick={() => patchLast({ quality: qualityLabel(last.quality) === q ? "" : q })}
                          style={{ ...ui.chip, ...(qualityLabel(last.quality) === q ? ui.chipOn : {}) }}>{q}</button>
                      ))}
                    </div>
                  )}
                  <div style={ui.chipRow}>
                    <button onClick={() => patchLast({ system: !last.system })} style={{ ...ui.chip, ...(last.system ? ui.chipOn : {}) }}>system wall</button>
                    {last.system && (
                      <input style={ui.input} placeholder="problem name" value={last.name}
                        onChange={(e) => patchLast({ name: e.target.value })} />
                    )}
                  </div>
                  <div style={ui.chipRow}>
                    {ANGLES.map((a) => (
                      <button key={a} onClick={() => patchLast({ angle: last.angle === a ? "" : a })}
                        style={{ ...ui.chip, ...(last.angle === a ? ui.chipOn : {}) }}>{a}</button>
                    ))}
                  </div>
                  <div style={ui.chipRow}>
                    {STYLES.map((a) => (
                      <button key={a} onClick={() => patchLast({ style: last.style === a ? "" : a })}
                        style={{ ...ui.chip, ...(last.style === a ? ui.chipOn : {}) }}>{a}</button>
                    ))}
                    <button style={{ ...ui.chip, color: "#D95545", borderColor: "#D95545" }} onClick={deleteLast}>delete</button>
                  </div>
                  <textarea
                    style={{ ...ui.textarea, marginTop: 10 }} rows={2}
                    placeholder="Note on this climb…"
                    value={last.note || ""} onChange={(e) => patchLast({ note: e.target.value })}
                  />
                </div>
              )}
              {last && !editOpen && mode == null && (
                <button style={ui.linkBtn} onClick={() => setEditOpen(true)}>
                  add notes to last climb ({gradeLabel(last)} {typeLabel(climbType(last))})
                </button>
              )}

              {/* goal + exercises */}
              <div style={ui.sectionLabel}>SESSION GOAL</div>
              <input style={{ ...ui.input, width: "100%" }} placeholder="e.g. 5 V3s & 5 V4s"
                value={active.goal} onChange={(e) => patchSession({ goal: e.target.value })} />

              <div style={ui.sectionLabel}>WARM-UP & EXERCISES (narrative)</div>
              <textarea
                style={ui.textarea} rows={5}
                placeholder={"Chin-ups 3×6 @ 60–80%…\nWrist ext 50lbs ×8, ×3 — elbow felt stable.\nFatigue 4/10."}
                value={active.exercises} onChange={(e) => patchSession({ exercises: e.target.value })}
              />

              <div style={ui.sectionLabel}>SESSION NOTES</div>
              <textarea
                style={ui.textarea} rows={4}
                placeholder={"Anything worth remembering: how the elbow felt, short on time, climbed with a friend, why there was a gap since last session…"}
                value={active.notes || ""} onChange={(e) => patchSession({ notes: e.target.value })}
              />

              <button style={{ ...ui.ghost, marginTop: 10 }} onClick={endSession}>End session</button>
              {!confirmCancel ? (
                <button style={{ ...ui.linkBtn, display: "block", margin: "10px auto 0" }} onClick={() => setConfirmCancel(true)}>
                  Cancel session (discard everything)
                </button>
              ) : (
                <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
                  <button style={{ ...ui.ghost, flex: 1, color: "#D95545", borderColor: "#D95545" }} onClick={cancelSession}>
                    Yes, discard this session
                  </button>
                  <button style={{ ...ui.ghost, flex: 1 }} onClick={() => setConfirmCancel(false)}>Keep it</button>
                </div>
              )}
            </>
          )}
        </main>
      )}

      {/* Timer stays mounted so a stray tab tap never kills a running protocol */}
      <div style={{ display: tab === "timer" ? "block" : "none" }}>
        <main style={ui.main}><TimerView /></main>
      </div>

      {tab === "history" && (
        <History sessions={data.sessions} entries={data.entries || []} onDelete={deleteSession} onDeleteEntry={deleteEntry} onShare={doShare} />
      )}

      {tab === "export" && (
        <main style={ui.main}>
          <p style={{ color: "#8b8f98", lineHeight: 1.5 }}>
            One file, <b style={{ color: "#f2efe8" }}>boulder-log-backup.md</b>: a readable digest on top,
            the complete data (lossless JSON, tombstones included) below. Share it to Box or a Claude chat —
            it can restore everything on any device. Individual sessions share from their History cards.
          </p>
          <button style={{ ...ui.primary, marginTop: 12 }} onClick={shareBackup}>Share backup</button>

          <div style={ui.sectionLabel}>IMPORT / RESTORE</div>
          <p style={{ color: "#8b8f98", fontSize: 12, lineHeight: 1.5, margin: "0 0 8px" }}>
            Pick or paste a backup file. Nothing is overwritten — records are merged in by id, with a preview first.
          </p>
          <input type="file" accept=".md,.txt,text/markdown,text/plain"
            style={{ color: "#8b8f98", fontSize: 12, marginBottom: 8, maxWidth: "100%" }}
            onChange={(ev) => {
              const f = ev.target.files && ev.target.files[0];
              if (f) f.text().then((t) => { setImportText(t); setImportPreview(null); });
            }} />
          <textarea style={ui.textarea} rows={4} placeholder="…or paste the whole backup file here"
            value={importText} onChange={(ev) => { setImportText(ev.target.value); setImportPreview(null); }} />
          <button style={{ ...ui.ghost, marginTop: 8, opacity: importText.trim() ? 1 : 0.35 }}
            disabled={!importText.trim()} onClick={previewImport}>
            Preview import
          </button>
          {importPreview && (importPreview.error ? (
            <div style={{ ...ui.card, color: "#E0A93E" }}>{importPreview.error}</div>
          ) : (
            <div style={ui.card}>
              <b>Backup holds {importPreview.backup.sessions.length} sessions, {(importPreview.backup.entries || []).length} entries,{" "}
                {(importPreview.backup.deleted || []).length} tombstones.</b>
              <div style={{ fontSize: 13, color: "#c9ccd6", marginTop: 6 }}>
                New to this device: {importPreview.newS.length} sessions, {importPreview.newE.length} entries.
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
                <button style={{ ...ui.primary, flex: 1 }} onClick={applyImport}>Apply merge</button>
                <button style={{ ...ui.ghost, flex: 1 }} onClick={() => setImportPreview(null)}>Cancel</button>
              </div>
            </div>
          ))}
        </main>
      )}
    </div>
  );
}

function Stat({ label, value, accent }) {
  return (
    <div style={{ flex: 1, textAlign: "center" }}>
      <div style={{ fontSize: 22, fontWeight: 800, color: accent ? "#E0A93E" : "#f2efe8", fontVariantNumeric: "tabular-nums" }}>{value}</div>
      <div style={{ fontSize: 10, letterSpacing: 1.4, color: "#8b8f98" }}>{label.toUpperCase()}</div>
    </div>
  );
}

function History({ sessions, entries, onDelete, onDeleteEntry, onShare }) {
  const [confirmId, setConfirmId] = useState(null);
  // sessions and standalone entries interleaved by date, sessions first on ties
  const items = [
    ...sessions.map((s) => ({ kind: "session", date: s.date, obj: s })),
    ...entries.map((e) => ({ kind: "entry", date: e.date, obj: e })),
  ].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.kind === "session" ? -1 : 1));
  const chron = [...sessions].sort((a, b) => (a.date > b.date ? 1 : -1));
  const scores = chron.map((s) => sessionStats(s).effort);
  const max = Math.max(...scores, 1), min = Math.min(...scores, 0);
  const W = 320, H = 90, PAD = 8;
  const x = (i) => PAD + (i * (W - 2 * PAD)) / Math.max(1, scores.length - 1);
  const y = (v) => H - PAD - ((v - min) * (H - 2 * PAD)) / Math.max(1, max - min);
  const path = scores.map((v, i) => `${i ? "L" : "M"}${x(i)},${y(v)}`).join(" ");

  return (
    <main style={ui.main}>
      <div style={ui.sectionLabel}>EFFORT SCORE TREND</div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", background: "#1d2026", borderRadius: 10 }}>
        <path d={path} fill="none" stroke="#E0A93E" strokeWidth="2.5" strokeLinecap="round" />
        {scores.map((v, i) => (
          <circle key={i} cx={x(i)} cy={y(v)} r="3.5" fill={chron[i].legacy ? "#8b8f98" : "#E0A93E"} />
        ))}
      </svg>
      <div style={{ fontSize: 11, color: "#8b8f98", margin: "6px 0 14px" }}>grey dots = notebook sessions</div>

      {items.map((it) => {
        if (it.kind === "entry") {
          const e = it.obj;
          return (
            <div key={e.id} style={{ ...ui.card, background: "none", border: "1px solid #24262c" }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <b style={{ color: "#c9ccd6", fontWeight: 600 }}>
                  {fmtDate(e.date)} · {e.kind || "entry"}{e.issue ? ` — ${e.issue}` : ""}
                </b>
                {e.kind === "test" && e.test_value != null && (
                  <b style={{ color: "#E0A93E" }}>{e.test_value}{e.test_unit ? ` ${e.test_unit}` : ""}</b>
                )}
              </div>
              {e.kind === "test" && e.test_name && (
                <div style={{ fontSize: 12, color: "#8b8f98", marginTop: 2 }}>{e.test_name}</div>
              )}
              {e.note && (
                <div style={{ fontSize: 12, color: "#8b8f98", marginTop: 6, whiteSpace: "pre-wrap" }}>{e.note}</div>
              )}
              {confirmId === e.id ? (
                <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  <button style={{ ...ui.chip, color: "#D95545", borderColor: "#D95545" }}
                    onClick={() => { onDeleteEntry(e.id); setConfirmId(null); }}>
                    Yes, delete this entry
                  </button>
                  <button style={ui.chip} onClick={() => setConfirmId(null)}>Keep it</button>
                </div>
              ) : (
                <div style={{ display: "flex", gap: 14 }}>
                  <button style={{ ...ui.linkBtn, padding: "6px 0 0" }} onClick={() => onShare(entryShareText(e))}>share</button>
                  <button style={{ ...ui.linkBtn, padding: "6px 0 0" }} onClick={() => setConfirmId(e.id)}>delete</button>
                </div>
              )}
            </div>
          );
        }
        const s = it.obj;
        const st = sessionStats(s);
        return (
          <div key={s.id} style={ui.card}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <b>{fmtDate(s.date)} · {s.label}{s.legacy ? " (notebook)" : ""}</b>
              <b style={{ color: "#E0A93E" }}>{st.effort}</b>
            </div>
            <div style={{ fontFamily: "ui-monospace, monospace", fontSize: 13, color: "#c9ccd6", marginTop: 4 }}>
              {ledger(st.dist)}
            </div>
            <div style={{ fontSize: 12, color: "#8b8f98", marginTop: 4 }}>
              {st.climbs} problems{!s.legacy && <> · {st.sends} sends ({st.sendScore}) · avg rest {mmss(st.avgRest)}</>}
            </div>
            {s.day_after && (
              <div style={{ fontSize: 12, marginTop: 4 }}>
                <span style={{ color: DAY_AFTER_COLOR[s.day_after.status] || "#c9ccd6" }}>●</span>
                <span style={{ color: "#c9ccd6" }}> day after: {s.day_after.status}</span>
                {s.day_after.note && <span style={{ color: "#8b8f98", fontStyle: "italic" }}> — {s.day_after.note}</span>}
              </div>
            )}
            {s.goal && <div style={{ fontSize: 12, color: "#8b8f98", marginTop: 2 }}>Goal: {s.goal}</div>}
            {s.exercises && (
              <div style={{ fontSize: 12, color: "#c9ccd6", marginTop: 6, whiteSpace: "pre-wrap", borderLeft: "2px solid #33363e", paddingLeft: 8 }}>
                {s.exercises}
              </div>
            )}
            {s.notes && (
              <div style={{ fontSize: 12, color: "#8b8f98", marginTop: 6, whiteSpace: "pre-wrap", fontStyle: "italic", borderLeft: "2px solid #33363e", paddingLeft: 8 }}>
                {s.notes}
              </div>
            )}
            {confirmId === s.id ? (
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button style={{ ...ui.chip, color: "#D95545", borderColor: "#D95545" }}
                  onClick={() => { onDelete(s.id); setConfirmId(null); }}>
                  Yes, delete this session
                </button>
                <button style={ui.chip} onClick={() => setConfirmId(null)}>Keep it</button>
              </div>
            ) : (
              <div style={{ display: "flex", gap: 14 }}>
                <button style={{ ...ui.linkBtn, padding: "6px 0 0" }} onClick={() => onShare(sessionShareText(s))}>share</button>
                <button style={{ ...ui.linkBtn, padding: "6px 0 0" }} onClick={() => setConfirmId(s.id)}>delete</button>
              </div>
            )}
          </div>
        );
      })}
    </main>
  );
}

function TimerView() {
  const saved = useRef((() => { try { return JSON.parse(localStorage.getItem(TIMER_KEY) || "null") || {}; } catch { return {}; } })()).current;
  const [cfg, setCfg] = useState({ ...TIMER_PRESETS.recruit, ...(saved.cfg || {}) });
  const [sound, setSound] = useState(saved.sound !== false);
  const [voice, setVoice] = useState(saved.voice !== false);
  const [manual, setManual] = useState(!!saved.manual);
  const [cfgOpen, setCfgOpen] = useState(false);
  const [disp, setDisp] = useState(() => ({ status: "idle", type: null, remain: cfg.prep > 0 ? cfg.prep : cfg.work, dur: 0, rep: 0, set: 0, elapsed: 0 }));
  const eng = useRef({ status: "idle", sched: [], idx: 0, endAt: 0, startedAt: 0, remainPaused: 0, lastTick: null, id: null });
  const wakeRef = useRef(null);
  const soundRef = useRef(sound); soundRef.current = sound;
  const voiceRef = useRef(voice); voiceRef.current = voice;

  useEffect(() => { try { localStorage.setItem(TIMER_KEY, JSON.stringify({ cfg, sound, voice, manual })); } catch {} }, [cfg, sound, voice, manual]);

  const cue = {
    work: () => { if (soundRef.current) beep(880, 0.18, 0.4); if (voiceRef.current) speak("Go"); },
    restRep: () => { if (soundRef.current) beep(440, 0.16, 0.3); },
    setDone: (n) => {
      if (soundRef.current) { beep(660, 0.12); setTimeout(() => beep(660, 0.12), 150); setTimeout(() => beep(660, 0.2), 300); }
      if (voiceRef.current) speak("Set " + n + " done");
    },
    tick: () => { if (soundRef.current) beep(1200, 0.05, 0.25); },
    prep: () => { if (voiceRef.current) speak("Get ready"); },
    finish: () => {
      if (soundRef.current) { beep(523, 0.2); setTimeout(() => beep(659, 0.2), 180); setTimeout(() => beep(784, 0.35), 360); }
      if (voiceRef.current) speak("Finished");
    },
  };

  const keepAwake = () => {
    try {
      if ("wakeLock" in navigator) navigator.wakeLock.request("screen").then((w) => { wakeRef.current = w; }).catch(() => {});
    } catch {}
  };
  const releaseAwake = () => { try { if (wakeRef.current) { wakeRef.current.release(); wakeRef.current = null; } } catch {} };

  const buildSchedule = () => {
    const s = [];
    if (cfg.prep > 0) s.push({ type: "prep", dur: cfg.prep, rep: 0, set: 1 });
    for (let set = 1; set <= cfg.sets; set++) {
      for (let rep = 1; rep <= cfg.reps; rep++) {
        s.push({ type: "work", dur: cfg.work, rep, set });
        if (rep !== cfg.reps && cfg.restRep > 0) s.push({ type: "restRep", dur: cfg.restRep, rep, set });
      }
      if (set < cfg.sets) {
        if (manual) s.push({ type: "await", dur: 0, rep: cfg.reps, set }); // superset mode: wait for a tap instead of counting down
        else if (cfg.restSet > 0) s.push({ type: "restSet", dur: cfg.restSet, rep: cfg.reps, set });
      }
    }
    return s;
  };

  const enterPhase = (i) => {
    const E = eng.current;
    const ph = E.sched[i];
    E.idx = i; E.lastTick = null;
    if (ph.type === "await") {
      E.status = "waiting";
      cue.setDone(ph.set);
      setDisp({ status: "waiting", type: "await", remain: 0, dur: 0, rep: ph.rep, set: ph.set, elapsed: (Date.now() - E.startedAt) / 1000 });
      return;
    }
    E.status = "running";
    E.endAt = Date.now() + ph.dur * 1000;
    if (ph.type === "work") cue.work();
    else if (ph.type === "restRep") cue.restRep();
    else if (ph.type === "restSet") cue.setDone(ph.set);
    else if (ph.type === "prep") cue.prep();
    setDisp({ status: "running", type: ph.type, remain: ph.dur, dur: ph.dur, rep: ph.rep, set: ph.set, elapsed: (Date.now() - E.startedAt) / 1000 });
  };

  const finish = () => {
    const E = eng.current;
    clearInterval(E.id); E.id = null; E.status = "done";
    releaseAwake(); cue.finish();
    setDisp({ status: "done", type: "done", remain: 0, dur: 0, rep: cfg.reps, set: cfg.sets, elapsed: (Date.now() - E.startedAt) / 1000 });
  };

  const tick = () => {
    const E = eng.current;
    if (E.status === "running") {
      const ph = E.sched[E.idx];
      const remain = (E.endAt - Date.now()) / 1000;
      const whole = Math.ceil(remain);
      if (whole <= 3 && whole > 0 && whole !== E.lastTick) { E.lastTick = whole; cue.tick(); }
      if (remain <= 0) {
        if (E.idx + 1 >= E.sched.length) { finish(); return; }
        enterPhase(E.idx + 1);
        return;
      }
      setDisp({ status: "running", type: ph.type, remain, dur: ph.dur, rep: ph.rep, set: ph.set, elapsed: (Date.now() - E.startedAt) / 1000 });
    } else if (E.status === "waiting") {
      setDisp((d) => ({ ...d, elapsed: (Date.now() - E.startedAt) / 1000 }));
    }
  };

  const start = () => {
    const E = eng.current;
    const c = audioCtx(); try { if (c && c.state === "suspended") c.resume(); } catch {}
    if (E.status === "paused") {
      E.status = "running"; E.endAt = Date.now() + E.remainPaused * 1000;
      keepAwake();
      if (!E.id) E.id = setInterval(tick, 100);
      return;
    }
    if (E.status === "waiting") { keepAwake(); enterPhase(E.idx + 1); return; }
    if (E.status === "running") return;
    const sched = buildSchedule();
    if (!sched.length) return;
    E.sched = sched; E.startedAt = Date.now();
    keepAwake();
    enterPhase(0);
    if (!E.id) E.id = setInterval(tick, 100);
  };

  const pause = () => {
    const E = eng.current;
    if (E.status !== "running") return;
    E.status = "paused";
    E.remainPaused = Math.max(0, (E.endAt - Date.now()) / 1000);
    releaseAwake();
    setDisp((d) => ({ ...d, status: "paused" }));
  };

  const resetTimer = (nextCfg) => {
    const E = eng.current;
    clearInterval(E.id); E.id = null; E.status = "idle";
    releaseAwake();
    const c = nextCfg || cfg;
    setDisp({ status: "idle", type: null, remain: c.prep > 0 ? c.prep : c.work, dur: 0, rep: 0, set: 0, elapsed: 0 });
  };

  useEffect(() => {
    const h = () => {
      const st = eng.current.status;
      if (document.visibilityState === "visible" && (st === "running" || st === "waiting")) keepAwake();
    };
    document.addEventListener("visibilitychange", h);
    return () => { document.removeEventListener("visibilitychange", h); clearInterval(eng.current.id); releaseAwake(); };
  }, []);

  const setField = (k, v, f) => {
    const val = Math.max(f.min, Math.min(f.max, v | 0));
    const next = { ...cfg, [k]: val };
    setCfg(next);
    if (eng.current.status === "idle" || eng.current.status === "done") resetTimer(next);
  };
  const applyPreset = (p) => { const next = { ...p }; setCfg(next); resetTimer(next); };
  const activePreset = Object.keys(TIMER_PRESETS).find((k) =>
    TIMER_FIELDS.every((f) => TIMER_PRESETS[k][f.k] === cfg[f.k])
  );

  const running = disp.status === "running" || disp.status === "paused";
  const isBreak = disp.type === "restSet" || disp.type === "await";
  const col = disp.status === "idle" ? "#8b8f98" : TCOLOR[disp.type] || "#8b8f98";
  const primaryLabel = { idle: "Start", running: "Pause", paused: "Resume", waiting: "Next set", done: "Start" }[disp.status];
  const sub = disp.status === "idle" ? "Pick a preset, then Start"
    : disp.status === "paused" ? "Paused"
    : disp.type === "work" ? (cfg.work <= 6 ? "Max effort" : "Hold")
    : disp.type === "restRep" ? "Next rep coming"
    : disp.type === "restSet" ? "Shake out — next set soon"
    : disp.type === "await" ? "Do your superset pair, then tap Next set"
    : disp.type === "prep" ? "Get set"
    : disp.type === "done" ? "Complete" : "";
  const frac = disp.dur > 0 ? 1 - disp.remain / disp.dur : disp.status === "waiting" || disp.status === "done" ? 1 : 0;
  const toggleBtn = (on) => ({ ...ui.chip, flex: 1, minWidth: 110, padding: "11px 8px", ...(on ? { borderColor: "#E0A93E", color: "#E0A93E" } : {}) });

  return (
    <>
      <div style={{
        background: isBreak && disp.status !== "idle" ? "#182430" : "#1d2026",
        border: `1px solid ${disp.status === "idle" ? "#33363e" : col}`,
        borderRadius: 16, padding: "22px 16px", textAlign: "center",
      }}>
        <div style={{ fontSize: 14, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", color: col }}>
          {disp.status === "idle" ? "Ready" : TLABEL[disp.type]}
        </div>
        <div style={{ fontSize: 76, fontWeight: 900, lineHeight: 1.05, fontVariantNumeric: "tabular-nums", color: disp.status === "idle" ? "#f2efe8" : col }}>
          {disp.status === "done" ? "✓" : disp.status === "waiting" ? "•" : Math.max(0, Math.ceil(disp.remain))}
        </div>
        <div style={{ fontSize: 13, color: "#8b8f98", minHeight: 18 }}>{sub}</div>
        <div style={{ height: 8, borderRadius: 6, background: "#14161a", overflow: "hidden", marginTop: 14 }}>
          <div style={{ height: "100%", width: `${frac * 100}%`, background: col, transition: "width 0.1s linear" }} />
        </div>
        <div style={{ display: "flex", justifyContent: "center", gap: 26, marginTop: 14 }}>
          <Stat label="Rep" value={disp.rep ? `${disp.rep}/${cfg.reps}` : "–"} />
          <Stat label="Set" value={disp.set ? `${disp.set}/${cfg.sets}` : "–"} />
          <Stat label="Elapsed" value={mmss(disp.elapsed)} />
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
          <button style={{ ...ui.primary, flex: 2, background: disp.status === "waiting" ? TCOLOR.work : "#E0A93E" }}
            onClick={() => (disp.status === "running" ? pause() : start())}>
            {primaryLabel}
          </button>
          <button style={{ ...ui.ghost, flex: 1, marginTop: 0 }} onClick={() => resetTimer()}>Reset</button>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 14 }}>
        {Object.keys(TIMER_PRESETS).map((k) => {
          const p = TIMER_PRESETS[k];
          const on = activePreset === k;
          return (
            <button key={k} onClick={() => applyPreset(p)}
              style={{
                background: on ? "#2a2418" : "#1d2026", border: `1px solid ${on ? "#E0A93E" : "#33363e"}`,
                borderRadius: 12, padding: "11px 10px", textAlign: "left", cursor: "pointer",
                color: "#f2efe8", fontSize: 13, fontWeight: 600, lineHeight: 1.35,
              }}>
              {p.name}
              <span style={{ display: "block", color: "#8b8f98", fontWeight: 400, fontSize: 11, marginTop: 2 }}>{p.desc}</span>
            </button>
          );
        })}
      </div>

      <button style={{ ...ui.linkBtn, display: "block", margin: "12px auto 0" }} onClick={() => setCfgOpen(!cfgOpen)}>
        {cfgOpen ? "hide custom settings" : "custom settings"}
      </button>
      {cfgOpen && (
        <div style={{ ...ui.card, marginTop: 6 }}>
          {TIMER_FIELDS.map((f, i) => (
            <div key={f.k} style={{
              display: "flex", alignItems: "center", justifyContent: "space-between",
              padding: "9px 0", borderTop: i ? "1px solid #24262c" : "none",
            }}>
              <label style={{ fontSize: 14 }}>
                {f.label}
                <small style={{ display: "block", color: "#8b8f98", fontSize: 11 }}>{f.note}</small>
              </label>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <button style={{ ...ui.chip, width: 38, height: 38, padding: 0, fontSize: 20, borderRadius: 10 }}
                  onClick={() => setField(f.k, cfg[f.k] - f.step, f)}>–</button>
                <input style={{ ...ui.input, width: 58, textAlign: "center" }} inputMode="numeric" value={cfg[f.k]}
                  onChange={(e) => { const n = parseInt(e.target.value, 10); setField(f.k, isNaN(n) ? f.min : n, f); }} />
                <button style={{ ...ui.chip, width: 38, height: 38, padding: 0, fontSize: 20, borderRadius: 10 }}
                  onClick={() => setField(f.k, cfg[f.k] + f.step, f)}>+</button>
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12 }}>
        <button style={toggleBtn(sound)} onClick={() => { setSound(!sound); if (!sound) { audioCtx(); beep(880, 0.12); } }}>
          {sound ? "🔊 Beeps on" : "🔇 Beeps off"}
        </button>
        <button style={toggleBtn(voice)} onClick={() => { setVoice(!voice); if (!voice) speak("Voice on"); }}>
          {voice ? "🗣 Voice on" : "Voice off"}
        </button>
        <button style={toggleBtn(manual)} onClick={() => { setManual(!manual); if (eng.current.status === "idle") resetTimer(); }}>
          {manual ? "✋ Manual set advance" : "Auto set rest"}
        </button>
      </div>
      <p style={{ color: "#8b8f98", fontSize: 12, lineHeight: 1.5, margin: "14px 4px 0" }}>
        Manual set advance replaces the set-rest countdown with a "tap when ready" hold — for supersets, where your rest is the other exercise.
        Screen stays awake while running. Phone must be off silent for beeps.
      </p>
    </>
  );
}
